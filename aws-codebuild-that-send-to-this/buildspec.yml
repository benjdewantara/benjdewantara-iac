version: 0.2
env:
  variables:
    S3_URI_PARENT: ${S3_URI_PARENT}
    ARN_IAM_ROLE_PARENT: ${ARN_IAM_ROLE_PARENT}
phases:
  build:
    commands:
      - echo "Hello World"
      - f_info=$(mktemp)
      - echo "This is information from another account" >> $f_info
      - aws sts get-caller-identity >> $f_info
      - echo "" >> $f_info
      - printenv >> $f_info
      - echo "Will now s3 cp to another account bucket"
      - roleSessionName="AWSCodeBuild-$CODEBUILD_LOG_PATH"
      - f_sts_assume_role=$(mktemp)
      - aws sts assume-role --role-arn $ARN_IAM_ROLE_PARENT --role-session-name $roleSessionName > $f_sts_assume_role
      - val=$(cat $f_sts_assume_role | jq -r .Credentials.AccessKeyId); export AWS_ACCESS_KEY_ID=$val
      - echo AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
      - val=$(cat $f_sts_assume_role | jq -r .Credentials.SecretAccessKey); export AWS_SECRET_ACCESS_KEY=$val
      - echo AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
      - val=$(cat $f_sts_assume_role | jq -r .Credentials.SessionToken); export AWS_SESSION_TOKEN=$val
      - echo AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN
      - aws s3 cp --content-type 'text/plain' $f_info $S3_URI_PARENT
